<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập Admin - UNI Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d8;
        }

        .error {
            color: #d93025;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🔐</div>

        <h1>UNI Library</h1>

        <p class="subtitle">
            Đăng nhập quản trị viên
        </p>

        <div id="error-message" class="error"></div>

        <form id="login-form">

            <div class="form-group">
                <label for="username">
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Nhập tên đăng nhập"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                🔑 Đăng nhập
            </button>

        </form>

        <a href="/" class="back-link">
            ← Quay lại chatbot
        </a>

    </div>

    <script>

        document
            .getElementById("login-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                const errorMessage =
                    document.getElementById("error-message");

                errorMessage.style.display = "none";

                try {

                    const response = await fetch("/admin/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })

                    });

                    const data = await response.json();

                    if (!response.ok) {

                        errorMessage.textContent =
                            "❌ " +
                            (data.error || "Đăng nhập thất bại.");

                        errorMessage.style.display = "block";

                        return;
                    }

                    window.location.href = "/admin";

                } catch (error) {

                    console.error(
                        "Lỗi đăng nhập:",
                        error
                    );

                    errorMessage.textContent =
                        "❌ Không thể kết nối đến máy chủ.";

                    errorMessage.style.display = "block";

                }

            });

    </script>

</body>
</html>
